name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile
        run: |
          python -m py_compile kvm_bridge_wifi.py
          python -m py_compile kvm_bridge_wifi_gui.py

      - name: Built-in selftest
        run: python kvm_bridge_wifi.py selftest

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI is wired up
        run: |
          python kvm_bridge_wifi.py --help
          python kvm_bridge_wifi.py run --help
